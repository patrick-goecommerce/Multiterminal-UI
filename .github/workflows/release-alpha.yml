name: Release Alpha

on:
  push:
    tags:
      - "v*-alpha*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.25

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          npm install
          npm run build

      - name: Stamp version into Windows resources
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > build/windows/info.json << EOF
          {
            "fixed": {
              "file_version": "$VERSION"
            },
            "info": {
              "0000": {
                "ProductVersion": "$VERSION",
                "CompanyName": "go eCommerce GmbH",
                "FileDescription": "Multiterminal UI",
                "LegalCopyright": "Copyright 2025-2026 go eCommerce GmbH",
                "ProductName": "Multiterminal UI",
                "Comments": "A terminal multiplexer for Claude Code power users"
              }
            }
          }
          EOF

      - name: Generate Windows resources (.syso)
        shell: bash
        run: |
          wails3 generate syso \
            -arch amd64 \
            -icon build/windows/icon.ico \
            -manifest build/windows/wails.exe.manifest \
            -info build/windows/info.json \
            -out wails_windows_amd64.syso

      - name: Build embedded helper binaries (GUI subsystem, no console flash)
        shell: bash
        run: |
          go build -ldflags "-H windowsgui" -o internal/backend/mtui-hook.exe ./cmd/mtui-hook
          go build -ldflags "-H windowsgui" -o internal/backend/mtui-statusline.exe ./cmd/mtui-statusline
          # The session daemon ships next to the app rather than embedded: it is
          # a long-running process the app starts, not a shim it invokes.
          VERSION="${GITHUB_REF_NAME#v}"
          go build \
            -ldflags "-s -w -H windowsgui -X github.com/patrick-goecommerce/Multiterminal-UI/internal/backend.Version=$VERSION" \
            -o build/bin/mtuid.exe ./cmd/mtuid
          # The CLI is the opposite case: it must stay console subsystem, or it
          # would write its output nowhere when run from a terminal. Named "mt"
          # because the GUI already owns mtui.exe on the PATH.
          go build \
            -ldflags "-s -w -X main.Version=$VERSION" \
            -o build/bin/mt.exe ./cmd/mt

      - name: Assert each binary has the subsystem it needs
        shell: bash
        run: |
          # 2 = GUI, 3 = console. Both directions are load-bearing: a console
          # subsystem on a helper flashes a window on every spawn, and a GUI
          # subsystem on the CLI swallows its own output.
          subsystem() {
            python -c "import struct,sys;d=open(sys.argv[1],'rb').read();pe=struct.unpack_from('<I',d,0x3c)[0];print(struct.unpack_from('<H',d,pe+0x5c)[0])" "$1"
          }
          for exe in internal/backend/mtui-statusline.exe internal/backend/mtui-hook.exe build/bin/mtuid.exe; do
            sub=$(subsystem "$exe")
            echo "$exe subsystem=$sub"; [ "$sub" = "2" ] || { echo "ERROR: $exe is not GUI subsystem (2)"; exit 1; }
          done
          sub=$(subsystem build/bin/mt.exe)
          echo "build/bin/mt.exe subsystem=$sub"
          [ "$sub" = "3" ] || { echo "ERROR: mt.exe is not console subsystem (3); it would print nothing"; exit 1; }

      - name: Build Go binary
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build \
            -tags desktop,production \
            -ldflags "-s -w -H windowsgui -X github.com/patrick-goecommerce/Multiterminal-UI/internal/backend.Version=$VERSION" \
            -o build/bin/mtui-portable.exe \
            .

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Inno Setup installer
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          iscc "installer.iss" //DMyAppVersion="$VERSION"

      - name: Stage portable artifact
        shell: bash
        run: |
          mv build/bin/mtui-portable.exe "mtui-portable-${{ steps.version.outputs.version }}.exe"
          cp build/bin/mtuid.exe "mtuid-${{ steps.version.outputs.version }}.exe"
          cp build/bin/mt.exe "mt-${{ steps.version.outputs.version }}.exe"

      - name: Stage installer artifact
        shell: bash
        run: |
          mv "installer-output/mtui-setup-${{ steps.version.outputs.version }}.exe" \
             "mtui-setup-${{ steps.version.outputs.version }}.exe"

      - name: Compute SHA256 checksums
        shell: bash
        run: |
          sha256sum "mtui-portable-${{ steps.version.outputs.version }}.exe" > "mtui-portable-${{ steps.version.outputs.version }}.exe.sha256"
          sha256sum "mtui-setup-${{ steps.version.outputs.version }}.exe" > "mtui-setup-${{ steps.version.outputs.version }}.exe.sha256"
          sha256sum "mtuid-${{ steps.version.outputs.version }}.exe" > "mtuid-${{ steps.version.outputs.version }}.exe.sha256"
          sha256sum "mt-${{ steps.version.outputs.version }}.exe" > "mt-${{ steps.version.outputs.version }}.exe.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: mtui-windows-alpha
          path: |
            mtui-portable-*.exe
            mtui-setup-*.exe
            mtuid-*.exe
            mt-*.exe
            *.sha256

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/mtui-portable-*.exe
            artifacts/mtui-setup-*.exe
            artifacts/mtuid-*.exe
            artifacts/mt-*.exe
            artifacts/*.sha256
